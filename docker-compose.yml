services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bench
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 20
  bench:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BENCH_DATABASE_URL: postgres://postgres:postgres@postgres:5432/bench
      LEDGER_URL: ${LEDGER_URL:-}
      LEDGER_TOKEN: ${LEDGER_TOKEN:-}
    volumes:
      - ${REPO:-.}:/repo
    command: ["watch", "--repo", "/repo", "--interval", "5m", "--agent", "gold", "--agent", "noop"]
